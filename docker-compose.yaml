services:
  client:
    container_name: client
    image: oracionxi/nextjs_client:v6
    restart: always
    ports:
      - 3000:3000
    depends_on:
      - server
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      retries: 3
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  server:
    container_name: server
    image: oracionxi/express_prisma_server:v3
    ports:
      - 8800:8800
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mydb?schema=public
    depends_on:
      - db
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8800/health"]
      interval: 30s
      retries: 3
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    command:
      ["/bin/sh", "-c", "npx prisma migrate dev --name init && node index.js"]

  db:
    container_name: postgresDB
    image: postgres:12
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shared-network

volumes:
  pgdata: {}

networks:
  shared-network:
    name: shared-network
    driver: bridge
    external: true
