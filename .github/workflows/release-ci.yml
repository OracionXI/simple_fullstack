name: Docker Image Build

on:
  push:
    tags:
      - "v*"

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
          
      - name: Build Docker Image
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/tags/}
          docker build -t ${{ env.DOCKER_USERNAME }}/express_prisma_server:$IMAGE_TAG ./server
          docker build -t ${{ env.DOCKER_USERNAME }}/nextjs_client:$IMAGE_TAG ./client
          docker push ${{ env.DOCKER_USERNAME }}/express_prisma_server:$IMAGE_TAG
          docker push ${{ env.DOCKER_USERNAME }}/nextjs_client:$IMAGE_TAG

  create-pull-request:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/tags/}
          if gh pr list \
          --base main \
          --head development --state open | grep -q "development"; \
          then echo "PR exists"
          else
            gh pr create \
              --base main \
              --head development \
              --title "Main Release Verison: $IMAGE_TAG" \
              --body "This pull request was automatically created by GitHub Actions."
            echo "PR created successfully."
          fi

          gh pr merge --merge --auto "$BRANCH_NAME || echo "Auto-merge failed."
          echo "PR merged successfully."

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i inventory.ini playbook.yml
